<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expiry Product Withdrawal System - UniMed UniHealth</title>
    
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans Bengali', 'sans-serif'],
                    },
                    colors: {
                        pharma: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts for Bengali & English -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Noto+Sans+Bengali:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <!-- React, ReactDOM & Babel for JSX Browser Compilation -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- pdf-make / html2canvas & jsPDF for perfect A4 generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Custom Print Styles for Flawless A4 Compilation -->
    <style>
        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            .no-print {
                display: none !important;
            }
            .print-page-break {
                page-break-after: always !important;
                break-after: page !important;
            }
        }
        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <div id="root"></div>

    <!-- React/Babel Dynamic Script Block -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // কনস্ট্যান্টস এবং প্রোডাক্ট গ্রুপ ম্যাপিং
        // ==========================================
        const GROUPS = {
            UHP: { key: 'UHP', label: 'ইউনিহেলথ (UHP)', color: 'from-blue-500 to-blue-600', text: 'text-blue-600', bg: 'bg-blue-50' },
            UMP: { key: 'UMP', label: 'ইউনিমেড (UMP)', color: 'from-teal-500 to-teal-600', text: 'text-teal-600', bg: 'bg-teal-50' },
            UD: { key: 'UD', label: 'ইউনিডার্মা (UD)', color: 'from-indigo-500 to-indigo-600', text: 'text-indigo-600', bg: 'bg-indigo-50' },
            NUV: { key: 'NUV', label: 'নিউলভা (NUV)', color: 'from-purple-500 to-purple-600', text: 'text-purple-600', bg: 'bg-purple-50' },
            'S&N': { key: 'S&N', label: 'অন্যান্য (S&N)', color: 'from-emerald-500 to-emerald-600', text: 'text-emerald-600', bg: 'bg-emerald-50' }
        };

        // অটো-সাজেশনের জন্য ডেমো প্রোডাক্ট লিস্ট
        const SUGGESTED_PRODUCTS = [
            { name: 'Fexo 120mg Tablet', group: 'UMP', packSize: 30, tradePrice: 240 },
            { name: 'Fexo 180mg Tablet', group: 'UMP', packSize: 30, tradePrice: 330 },
            { name: 'Rabe-20 Capsule', group: 'UHP', packSize: 50, tradePrice: 350 },
            { name: 'DermaSoothe Cream 50g', group: 'UD', packSize: 1, tradePrice: 180 },
            { name: 'Nervon Max Injection', group: 'NUV', packSize: 5, tradePrice: 600 },
            { name: 'NutriJoint Tablet', group: 'S&N', packSize: 30, tradePrice: 900 },
            { name: 'UniGrip Cold Tablet', group: 'UHP', packSize: 100, tradePrice: 200 },
            { name: 'Cal-D Max Tablet', group: 'UMP', packSize: 30, tradePrice: 270 }
        ];

        const INITIAL_FORM = {
            salesCenter: 'ঢাকা সেন্ট্রাল ডিপো',
            date: new Date().toISOString().split('T')[0],
            chemistName: 'আল-মদিনা ফার্মেসি',
            chemistAddress: 'ধানমন্ডি, ঢাকা',
            chemistMobile: '01712345678',
            formFilledBy: 'আনিসুর রহমান',
            mpoName: 'কামরুল হাসান',
            asmName: 'জহিরুল ইসলাম',
            actionTaken: 'নতুন স্টক দ্বারা প্রতিস্থাপন করা হবে',
            takenOverBy: 'মোঃ তারিকুল ইসলাম',
            notes: 'শারীরিক ইনভেন্টরির সাথে ব্যাচ নম্বরগুলো যাচাই করা হয়েছে।',
            invoiceNo: 'INV-2026-9001',
            invoiceDate: new Date().toISOString().split('T')[0],
            products: [
                { id: '1', name: 'Fexo 120mg Tablet', group: 'UMP', packSize: 30, batchNo: 'FX99401', mfgDate: '2025-05-10', expiryDate: '2026-05-10', quantity: 15, tradePrice: 240, value: 120.00 },
                { id: '2', name: 'Rabe-20 Capsule', group: 'UHP', packSize: 50, batchNo: 'RB33412', mfgDate: '2025-03-12', expiryDate: '2026-03-12', quantity: 20, tradePrice: 350, value: 140.00 }
            ],
            totals: { UHP: 140.00, UMP: 120.00, UD: 0, NUV: 0, 'S&N': 0, grand: 260.00 }
        };

        function App() {
            const [currentPage, setCurrentPage] = useState('dashboard'); // 'dashboard' | 'new-form' | 'history' | 'analytics'
            const [formTab, setFormTab] = useState('basic'); // 'basic' | 'products'
            const [forms, setForms] = useState([]);
            const [currentForm, setCurrentForm] = useState(INITIAL_FORM);
            const [theme, setTheme] = useState('light');
            const [searchQuery, setSearchQuery] = useState('');
            const [filterGroup, setFilterGroup] = useState('all');
            const [isGeneratingPDF, setIsGeneratingPDF] = useState(false);
            const [editingFormId, setEditingFormId] = useState(null);
            
            // প্রোডাক্ট এন্ট্রি পপ-আপ স্টেট
            const [isProductModalOpen, setIsProductModalOpen] = useState(false);
            const [editingProductIndex, setEditingProductIndex] = useState(null);
            const [productForm, setProductForm] = useState({
                name: '',
                group: 'UHP',
                packSize: 10,
                batchNo: '',
                mfgDate: '',
                expiryDate: '',
                quantity: 0,
                tradePrice: 0,
                value: 0
            });

            // নোটিফিকেশন এবং কনফার্মেশন স্টেট
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [confirmModalConfig, setConfirmModalConfig] = useState({ title: '', message: '', action: null });
            const [showPdfPreview, setShowPdfPreview] = useState(false);

            // অটো-সাজেশন ড্রপডাউন স্টেট
            const [showSuggestions, setShowSuggestions] = useState(false);

            // লোকাল স্টোরেজ থেকে ডেটা লোড করা
            useEffect(() => {
                const savedForms = localStorage.getItem('expiry_forms');
                if (savedForms) {
                    setForms(JSON.parse(savedForms));
                } else {
                    const initialForms = [{ ...INITIAL_FORM, id: 'EXP-101', createdAt: new Date().toISOString() }];
                    setForms(initialForms);
                    localStorage.setItem('expiry_forms', JSON.stringify(initialForms));
                }
                
                // সিস্টেম থিম রিড করা
                const savedTheme = localStorage.getItem('app_theme') || 'light';
                setTheme(savedTheme);
                document.documentElement.classList.toggle('dark', savedTheme === 'dark');
            }, []);

            // থিম পরিবর্তন করা
            const toggleTheme = () => {
                const newTheme = theme === 'light' ? 'dark' : 'light';
                setTheme(newTheme);
                localStorage.setItem('app_theme', newTheme);
                document.documentElement.classList.toggle('dark', newTheme === 'dark');
            };

            // নোটিফিকেশন দেখানোর হেল্পার
            const showNotification = (message, type = 'success') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3000);
            };

            // রিয়েল-টাইম ভ্যালু ক্যালকুলেশন ফর্মুলা: (Trade Price / Pack Size) * Quantity
            const calculateValue = (tp, ps, qty) => {
                const tradePrice = parseFloat(tp) || 0;
                const packSize = parseFloat(ps) || 0;
                const quantity = parseFloat(qty) || 0;
                if (packSize <= 0) return 0;
                return parseFloat(((tradePrice / packSize) * quantity).toFixed(2));
            };

            // প্রোডাক্ট ফর্ম ইনপুট চেঞ্জ হ্যান্ডলার
            const handleProductInputChange = (field, value) => {
                const updated = { ...productForm, [field]: value };
                if (['tradePrice', 'packSize', 'quantity'].includes(field)) {
                    updated.value = calculateValue(updated.tradePrice, updated.packSize, updated.quantity);
                }
                setProductForm(updated);
            };

            // অটো-সাজেশন থেকে প্রোডাক্ট সিলেক্ট করা
            const selectSuggestedProduct = (prod) => {
                setProductForm(prev => ({
                    ...prev,
                    name: prod.name,
                    group: prod.group,
                    packSize: prod.packSize,
                    tradePrice: prod.tradePrice,
                    value: calculateValue(prod.tradePrice, prod.packSize, prev.quantity)
                }));
                setShowSuggestions(false);
                showNotification(`${prod.name} সিলেক্ট করা হয়েছে`, 'success');
            };

            // পপ-আপ থেকে প্রোডাক্ট সেভ/আপডেট করা
            const saveProductFromModal = () => {
                if (!productForm.name) {
                    showNotification('অনুগ্রহ করে প্রোডাক্টের নাম লিখুন', 'error');
                    return;
                }
                if (productForm.packSize <= 0) {
                    showNotification('প্যাক সাইজ ০ এর চেয়ে বেশি হতে হবে', 'error');
                    return;
                }
                if (productForm.quantity <= 0) {
                    showNotification('পরিমাণ অবশ্যই ০ এর চেয়ে বেশি হতে হবে', 'error');
                    return;
                }

                let updatedProducts = [...currentForm.products];
                if (editingProductIndex !== null) {
                    updatedProducts[editingProductIndex] = { ...productForm };
                    showNotification('প্রোডাক্ট তথ্য আপডেট করা হয়েছে', 'success');
                } else {
                    updatedProducts.push({ ...productForm, id: Date.now().toString() });
                    showNotification('নতুন প্রোডাক্ট যোগ করা হয়েছে', 'success');
                }

                const updatedTotals = recalculateTotals(updatedProducts);
                setCurrentForm({ ...currentForm, products: updatedProducts, totals: updatedTotals });
                setIsProductModalOpen(false);
                setEditingProductIndex(null);
            };

            // প্রোডাক্ট এডিটের জন্য পপ-আপ ওপেন করা
            const openEditProductModal = (index) => {
                setEditingProductIndex(index);
                setProductForm({ ...currentForm.products[index] });
                setIsProductModalOpen(true);
            };

            // নতুন প্রোডাক্ট যোগ করার জন্য পপ-আপ ওপেন করা
            const openAddProductModal = () => {
                setEditingProductIndex(null);
                setProductForm({
                    name: '',
                    group: 'UHP',
                    packSize: 10,
                    batchNo: '',
                    mfgDate: '',
                    expiryDate: '',
                    quantity: 0,
                    tradePrice: 0,
                    value: 0
                });
                setIsProductModalOpen(true);
            };

            // প্রোডাক্ট ডিলিট করা
            const deleteProduct = (index) => {
                const updatedProducts = currentForm.products.filter((_, i) => i !== index);
                const updatedTotals = recalculateTotals(updatedProducts);
                setCurrentForm({ ...currentForm, products: updatedProducts, totals: updatedTotals });
                showNotification('প্রোডাক্ট তালিকা থেকে মুছে ফেলা হয়েছে', 'info');
            };

            // টোটাল হিসাব পুনর্গণনা করা
            const recalculateTotals = (products) => {
                const totals = { UHP: 0, UMP: 0, UD: 0, NUV: 0, 'S&N': 0, grand: 0 };
                products.forEach(p => {
                    const val = calculateValue(p.tradePrice, p.packSize, p.quantity);
                    if (totals[p.group] !== undefined) {
                        totals[p.group] = parseFloat((totals[p.group] + val).toFixed(2));
                    } else {
                        totals['S&N'] = parseFloat((totals['S&N'] + val).toFixed(2));
                    }
                });
                totals.grand = parseFloat((totals.UHP + totals.UMP + totals.UD + totals.NUV + totals['S&N']).toFixed(2));
                return totals;
            };

            // মূল ফর্ম ডেটা সেভ করা
            const saveFormSubmission = () => {
                if (!currentForm.salesCenter || !currentForm.chemistName || !currentForm.chemistMobile) {
                    showNotification('অনুগ্রহ করে প্রয়োজনীয় সব বেসিক তথ্য পূরণ করুন', 'error');
                    setFormTab('basic');
                    return;
                }
                if (currentForm.products.length === 0) {
                    showNotification('কমপক্ষে একটি প্রোডাক্ট যোগ করতে হবে', 'error');
                    setFormTab('products');
                    return;
                }

                let updatedForms = [...forms];
                if (editingFormId) {
                    updatedForms = forms.map(f => f.id === editingFormId ? { ...currentForm, updatedAt: new Date().toISOString() } : f);
                    showNotification('প্রত্যাহার ফর্মটি সফলভাবে আপডেট করা হয়েছে');
                } else {
                    const newForm = { ...currentForm, id: `EXP-${Date.now()}`, createdAt: new Date().toISOString() };
                    updatedForms = [newForm, ...updatedForms];
                    showNotification('নতুন প্রত্যাহার ফর্ম সফলভাবে সংরক্ষণ করা হয়েছে');
                }

                setForms(updatedForms);
                localStorage.setItem('expiry_forms', JSON.stringify(updatedForms));
                setEditingFormId(null);
                setCurrentPage('dashboard');
            };

            // ফর্ম ডিলিট কনফার্মেশন
            const confirmDeleteForm = (id) => {
                setConfirmModalConfig({
                    title: 'ফর্ম মুছে ফেলার নিশ্চিতকরণ',
                    message: 'আপনি কি নিশ্চিতভাবে এই প্রত্যাহার ফর্মটি মুছে ফেলতে চান? এটি আর ফিরিয়ে আনা সম্ভব নয়।',
                    action: () => {
                        const filtered = forms.filter(f => f.id !== id);
                        setForms(filtered);
                        localStorage.setItem('expiry_forms', JSON.stringify(filtered));
                        showNotification('ফর্মটি সফলভাবে মুছে ফেলা হয়েছে', 'info');
                        setShowConfirmModal(false);
                    }
                });
                setShowConfirmModal(true);
            };

            // ১০টি প্রোডাক্ট আকারে এরে-কে ভাগ করার ডায়নামিক হেল্পার
            const chunkProducts = (productsList, size = 10) => {
                const chunks = [];
                for (let i = 0; i < productsList.length; i += size) {
                    chunks.push(productsList.slice(i, i + size));
                }
                if (chunks.length === 0) chunks.push([]); 
                return chunks;
            };

            // ডায়নামিক মাল্টি-পেজ পিডিএফ তৈরি এবং ডাউনলোড
            const generateMultiPagePDF = async (claimData) => {
                setIsGeneratingPDF(true);
                showNotification('পিডিএফ ইঞ্জিন প্রস্তুত করা হচ্ছে...', 'info');

                try {
                    const element = document.getElementById('pdf-render-hidden-container');
                    element.style.display = 'block'; 

                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    const pages = element.querySelectorAll('.pdf-page-sheet');

                    for (let i = 0; i < pages.length; i++) {
                        const canvas = await window.html2canvas(pages[i], {
                            scale: 2,
                            useCORS: true,
                            backgroundColor: '#FFFFFF',
                            logging: false
                        });
                        const imgData = canvas.toDataURL('image/png');
                        if (i > 0) pdf.addPage();
                        pdf.addImage(imgData, 'PNG', 0, 0, 210, 297, '', 'FAST');
                    }

                    const dateStr = claimData.date || new Date().toISOString().split('T')[0];
                    pdf.save(`expiry-form-${dateStr}.pdf`);
                    showNotification('পিডিএফ ফাইল সফলভাবে ডাউনলোড হয়েছে!', 'success');
                    element.style.display = 'none'; 
                } catch (err) {
                    console.error(err);
                    showNotification('পিডিএফ রেন্ডার করতে সমস্যা হয়েছে। অনুগ্রহ করে ডিভাইস প্রিন্ট ব্যবহার করুন।', 'error');
                } finally {
                    setIsGeneratingPDF(false);
                }
            };

            // ফিল্টার করা ফর্মের তালিকা
            const filteredForms = forms.filter(form => {
                const matchesSearch = 
                    form.chemistName?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    form.salesCenter?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    form.id?.toLowerCase().includes(searchQuery.toLowerCase());
                if (filterGroup === 'all') return matchesSearch;
                return matchesSearch && form.products.some(p => p.group === filterGroup);
            });

            return (
                <div className="flex flex-col min-h-screen">
                    
                    {/* হেডার */}
                    <header className="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm px-4 py-3.5 flex items-center justify-between no-print">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white font-black text-xl shadow-md">
                                U
                            </div>
                            <div>
                                <h1 className="text-xs font-bold tracking-wider text-slate-400 dark:text-slate-500 uppercase">
                                    UniMed UniHealth Pharmaceuticals Ltd.
                                </h1>
                                <p className="text-sm md:text-base font-extrabold text-slate-800 dark:text-white leading-tight">
                                    এক্সপায়ারি প্রোডাক্ট প্রত্যাহার সিস্টেম (F-MRK-8.2.1-006)
                                </p>
                            </div>
                        </div>

                        <button 
                            onClick={toggleTheme}
                            className="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors text-lg"
                            title="থিম পরিবর্তন"
                        >
                            {theme === 'light' ? '🌙' : '☀️'}
                        </button>
                    </header>

                    {/* নেভিগেশন মেনু */}
                    <nav className="bg-slate-100 dark:bg-slate-950 px-4 py-2.5 flex items-center gap-1 overflow-x-auto border-b border-slate-200 dark:border-slate-800 scrollbar-none no-print">
                        <button 
                            onClick={() => setCurrentPage('dashboard')}
                            className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${
                                currentPage === 'dashboard' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800'
                            }`}
                        >
                            🏠 ড্যাশবোর্ড
                        </button>
                        <button 
                            onClick={() => {
                                setEditingFormId(null);
                                setCurrentForm(INITIAL_FORM);
                                setFormTab('basic');
                                setCurrentPage('new-form');
                            }}
                            className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${
                                currentPage === 'new-form' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800'
                            }`}
                        >
                            ➕ নতুন প্রত্যাহার ফর্ম
                        </button>
                        <button 
                            onClick={() => setCurrentPage('history')}

                                              <div className="flex justify-between font-mono">NUV Tk.: <span>{(currentForm.totals.NUV || 0).toFixed(2)}</span></div>

                                            <div className="col-span-4 border border-black p-1.5 flex flex-col justify-between" style={{ borderColor: '#000' }}>

                                          </div>

                                          পরবর্তী পৃষ্ঠায় সিগনেচার এবং গ্রুপ সাবটোটাল সামারি তালিকা অবিরত থাকবে...
                                        </div>
                                      )}

                                      <div className="absolute bottom-2 left-6 right-6 border border-black grid grid-cols-12 text-[7px] font-mono leading-normal" style={{ borderColor: '#000' }}>
                                        <div className="col-span-3 border-r border-black p-1" style={{ borderColor: '#000' }}>Reviewed by: <span className="font-bold">SIT QSS</span></div>
                                        <div className="col-span-6 border-r border-black p-1 text-center" style={{ borderColor: '#000' }}>Printed copies are uncontrolled. Must include the QISS cover sheet.</div>
                                        <div className="col-span-3 p-1 text-right">Approved: <span className="font-bold">SEE QSS</span></div>
                                      </div>

                                    </div>

                                </div>

                                <div className="px-6 py-4 border-t border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 flex items-center justify-end gap-2">
                                  <button 
                                    onClick={() => setShowPdfPreview(false)}

                                  >
                                    বাতিল করুন
                                  </button>
                                  <button 
                                    onClick={() => {

                                    }}

                                  >
                                    📄 প্রিন্ট করুন (A4)
                                  </button>
                                  <button 
                                    onClick={() => generateMultiPagePDF(currentForm)}
                                    disabled={isGeneratingPDF}
                                    className="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-black flex items-center gap-1.5 transition-all"
                                  >
                                    {isGeneratingPDF ? 'রেন্ডারিং...' : '📥 পিডিএফ ডাউনলোড'}
                                  </button>

                            </div>
                        </div>
                    )}

                    {/* ==========================================
                        ৩. ব্যাকগ্রাউন্ডে পিডিএফ রেন্ডারের কন্টেইনার (হাইড করা থাকবে)
                        ========================================== */}
                    <div id="pdf-render-hidden-container" className="absolute left-[-9999px] top-[-9999px] hidden">
                      {chunkProducts(currentForm.products, 10).map((productChunk, pageIdx, allChunks) => (

                          style={{ width: '210mm', height: '297mm', color: '#000000', backgroundColor: '#FFFFFF' }}

                          <div className="border border-black flex" style={{ borderColor: '#000' }}>
                            <div className="w-[30%] border-r border-black p-3 flex flex-col items-center justify-center text-center" style={{ borderColor: '#000' }}>
                              <div className="w-10 h-10 border border-black flex items-center justify-center font-black text-xl mb-1" style={{ borderColor: '#000' }}>U</div>
                              <span className="text-[10px] font-bold leading-tight">UniMed UniHealth</span>
                              <span className="text-[9px] leading-tight">Pharmaceuticals Ltd.</span>
                            </div>

                              <div className="p-1 text-right" style={{ borderColor: '#000' }}>Page {pageIdx + 1} of {allChunks.length}</div>
                            </div>

                            <div>Name of the Sales Center: <span className="underline font-bold">{currentForm.salesCenter || '........................'}</span></div>
                            <div className="text-right font-mono">Date: <span className="underline font-bold">{currentForm.date}</span></div>
                          </div>

                          <h4 className="text-xs font-bold uppercase my-2">List of expired products (আইটেম {pageIdx * 10 + 1} - {pageIdx * 10 + productChunk.length}):</h4>

                                  <td className="border-r border-black p-1 font-mono" style={{ borderColor: '#000' }}>{row.packSize}</td>
                                  <td className="border-r border-black p-1 font-mono" style={{ borderColor: '#000' }}>{row.batchNo || '-'}</td>
                                  <td className="border-r border-black p-1 font-mono" style={{ borderColor: '#000' }}>{row.mfgDate || '-'}</td>
                                  <td className="border-r border-black p-1 font-mono font-bold text-rose-600" style={{ borderColor: '#000' }}>{row.expiryDate}</td>

                                  <td className="border-r border-black p-1" style={{ borderColor: '#000' }}></td>
                                  <td className="border-r border-black p-1" style={{ borderColor: '#000' }}></td>
                                  <td className="border-r border-black p-1" style={{ borderColor: '#000' }}></td>
                                  <td className="border-r border-black p-1" style={{ borderColor: '#000' }}></td>
                                  <td className="border-r border-black p-1" style={{ borderColor: '#000' }}></td>
                                  <td className="p-1"></td>

                                  </div>
                                </div>

                                <div className="col-span-4 border border-black p-2 rounded-sm flex flex-col justify-between" style={{ borderColor: '#000' }}>
                                  <span className="font-bold block text-[8px]">Action Taken:</span>
                                  <span className="font-semibold block">{currentForm.actionTaken}</span>
                                </div>
                              </div>

                              <div className="border border-black p-2 text-[9px] leading-relaxed mb-3" style={{ borderColor: '#000' }}>
                                <span className="font-bold">To: Sales Center In-charge.</span> Please arrange to collect the expired products from the chemist as per the list mentioned in this form and ensure replacement of equivalent value.
                              </div>

                              <div className="grid grid-cols-2 gap-4 text-[10px] border-t border-black pt-3" style={{ borderColor: '#000' }}>
                                <div>Received replaced vide Invoice No. <span className="font-bold font-mono">{currentForm.invoiceNo}</span></div>
                                <div className="text-right">Dated: <span className="font-bold font-mono">{currentForm.invoiceDate}</span></div>
                              </div>
                            </div>

                            <div className="col-span-3 border-r border-black p-1" style={{ borderColor: '#000' }}>Reviewed by: <span className="font-bold">SIT QSS</span></div>
                            <div className="col-span-6 border-r border-black p-1 text-center" style={{ borderColor: '#000' }}>Printed copies are uncontrolled. Must include the QISS cover sheet.</div>
                            <div className="col-span-3 p-1 text-right">Approved By: <span className="font-bold">SEE QSS</span></div>
                          </div>
                        </div>
                      ))}

                    {/* ==========================================
                        ৪. সিস্টেম কনফার্মেশন মডাল
                        ========================================== */}
                    {showConfirmModal && (

                          <h4 className="text-lg font-bold text-slate-900 dark:text-white">{confirmModalConfig.title}</h4>
                          <p className="text-sm text-slate-500 dark:text-slate-400 leading-relaxed">{confirmModalConfig.message}</p>
                          <div className="flex items-center justify-end gap-2 pt-2">
                            <button 
                              onClick={() => setShowConfirmModal(false)}
                              className="px-4 py-2 text-xs font-semibold rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:text-slate-200"

                              না, ফিরে যান

                              onClick={confirmModalConfig.action}

                            >
                              হ্যাঁ, মুছে ফেলুন
                            </button>
                          </div>
                        </div>
                      </div>
                    )}

                    {/* রিয়েল-টাইম টোস্ট নোটিফিকেশন */}
                    {toast.show && (
                      <div className="fixed bottom-4 right-4 z-50 animate-bounce">
                        <div className="px-5 py-3.5 rounded-2xl shadow-xl flex items-center gap-3 bg-slate-950 text-white text-xs font-bold border border-slate-800">
                          <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
                          {toast.message}
                        </div>
                      </div>
                    )}

                    {/* মোবাইল রেসপন্সিভ নেভিগেশন বার */}
                    <footer className="sm:hidden sticky bottom-0 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-3 px-6 flex justify-between items-center z-40 no-print">
                      <button 
                        onClick={() => setCurrentPage('dashboard')}
                        className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${currentPage === 'dashboard' ? 'text-blue-600' : 'text-slate-400'}`}
                      >
                        🏠 Hub
                      </button>
                      <button 
                        onClick={() => {
                          setEditingFormId(null);
                          setCurrentForm(INITIAL_FORM);
                          setFormTab('basic');
                          setCurrentPage('new-form');
                        }}
                        className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${currentPage === 'new-form' ? 'text-blue-600' : 'text-slate-400'}`}
                      >
                        ➕ New Claim
                      </button>
                      <button 
                        onClick={() => setCurrentPage('history')}
                        className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${currentPage === 'history' ? 'text-blue-600' : 'text-slate-400'}`}
                      >
                        📋 Records
                      </button>
                    </footer>

                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
